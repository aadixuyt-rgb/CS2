name: Build Minecraft Resource Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Arrange resource-pack folders
        run: |
          mkdir -p build/assets/minecraft/textures/item/diamond_sword
          cp pack.mcmeta build/pack.mcmeta

          # Put the main sword texture at Minecraft's standard item-texture path.
          cp diamond_sword/item.png build/assets/minecraft/textures/item/diamond_sword.png

          # Keep the extra texture files inside the pack in an organized folder.
          cp diamond_sword/knife_edge_*.png build/assets/minecraft/textures/item/diamond_sword/
          cp diamond_sword/left_hand.png build/assets/minecraft/textures/item/diamond_sword/
          cp diamond_sword/right_hand.png build/assets/minecraft/textures/item/diamond_sword/
          cp diamond_sword/left_hand.png.mcmeta build/assets/minecraft/textures/item/diamond_sword/

      - name: Build ZIP
        run: |
          cd build
          zip -r ../dist-placeholder.zip pack.mcmeta assets
          mkdir -p ../dist
          mv ../dist-placeholder.zip ../dist/CS2-resource-pack.zip

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: CS2-resource-pack
          path: dist/CS2-resource-pack.zip
          if-no-files-found: error
          retention-days: 14
