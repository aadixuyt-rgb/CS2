name: Build Minecraft Resource Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/CS2-resource-pack.zip pack.mcmeta attack diamond_sword

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: CS2-resource-pack
          path: dist/CS2-resource-pack.zip
          if-no-files-found: error
          retention-days: 14
